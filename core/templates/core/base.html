<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %}Django Chat</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-teal-600">
        <nav class="flex items-center justify-between px-4 py-6 bg-teal-800">
            <a href="{% url 'frontpage' %}" class="text-xl text-white">Django Chat</a>

            <div class="flex items-center space-x-4">
                {% if request.user.is_authenticated %}
                    <span class="text-teal-100">{{ request.user.username }}</span>
                    <a href="{% url 'rooms' %}" class="text-white hover:text-gray-300">Rooms</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="px-5 py-3 rounded-xl text-white bg-teal-600 hover:bg-teal-700">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-white hover:text-gray-300">Log in</a>
                    <a href="{% url 'signup' %}" class="px-5 py-3 rounded-xl text-white bg-teal-600 hover:bg-teal-700">Sign up</a>
                {% endif %}
            </div>
        </nav>

        {% block content %}{% endblock %}

        {% block scripts %}{% endblock %}
    </body>
</html>
