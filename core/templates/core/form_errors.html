{% for error in form.non_field_errors %}
    <div class="mb-5 p-4 rounded-xl bg-red-400 text-white"><p>{{ error }}</p></div>
{% endfor %}
{% for field in form %}
    {% for error in field.errors %}
        <div class="mb-5 p-4 rounded-xl bg-red-400 text-white"><p>{{ error }}</p></div>
    {% endfor %}
{% endfor %}
