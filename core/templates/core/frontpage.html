{% extends 'core/base.html' %}

{% block title %}Welcome | {% endblock %}

{% block content %}
<div class="p-10 lg:p-20 text-center">
    <h1 class="text-3xl lg:text-6xl text-white">Django Chat</h1>
    <p class="mt-6 text-lg text-teal-100">Real-time chat rooms with text messages and file sharing over WebSockets.</p>
    {% if request.user.is_authenticated %}
        <a href="{% url 'rooms' %}" class="inline-block mt-8 px-5 py-3 rounded-xl text-white bg-teal-800 hover:bg-teal-700">Go to rooms</a>
    {% else %}
        <a href="{% url 'signup' %}" class="inline-block mt-8 px-5 py-3 rounded-xl text-white bg-teal-800 hover:bg-teal-700">Create an account</a>
    {% endif %}
</div>
{% endblock %}
